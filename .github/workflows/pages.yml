name: Deploy Composer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/configure-pages@v5
      - run: npm test
      - run: npm run build:pages
      - run: npm run smoke
      - uses: actions/upload-pages-artifact@v4
        with:
          path: work/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}agent-architecture-composer/
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
